name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Scratch TimescaleDB for the meter tests (same image as make db-up); never the Tiger service.
      tsdb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: preflight
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:preflight@localhost:5434/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy
      - name: Engine never names demo node ids
        run: |
          ids=$(python -c "from app.preflight.data.demo import demo_facility; print('|'.join(n.id for n in demo_facility().nodes))")
          ! grep -rnE "$ids" engine/
      - run: python -m pytest -q
      - name: TTU harness with the real plugin (jq is installed on the runner)
        run: python -m tests.test_harness

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  rehearsal:
    # Clicks through docs/DEMO.md against a real backend; fails if the app and the demo script disagree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          PREFLIGHT_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-trace
          path: frontend/test-results/
