[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/preflight"]  # tests/test_harness.py is a script: python -m tests.test_harness

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["engine/**/*.py", "app/preflight/**/*.py", "tests/preflight/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.mypy]
python_version = "3.11"
files = ["engine"]
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
